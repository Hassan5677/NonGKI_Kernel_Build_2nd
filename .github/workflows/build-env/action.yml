name: 'Set up the system environment for compilation.'

runs:
  using: 'composite'
  steps:
      - name: Output System OS
        shell: bash
        run: |
          title() {
              echo -e "\033[1;36m"
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                         $1                         ║"
              echo "╚════════════════════════════════════════════════════════════════════╝"
              echo -e "\033[1;36m"
          }

          footer(){
              echo -e "\033[1;36m"
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                                                                    ║"
              echo "╚════════════════════════════════════════════════════════════════════╝"
              echo -e "\033[1;36m"
          }

          context() {
              echo -e "\033[0m $1: \033[1;37m$2\033[0m"
          }

          . /etc/os-release

          title "System Information"
          context "OS" "$PRETTY_NAME"
          context "User" "$(whoami)"
          context "Current Folder" "$(pwd)"
          context "Shell" "$SHELL"

          footer

      - name: Check System OS
        shell: bash
        run: |
          . /etc/os-release

          if [ "$ID" = "ubuntu" ]; then
              if [ "$VERSION_ID" = "20.04" ]; then
                  echo "SYSTEM_VERSION=oldest" >> $GITHUB_ENV
              elif [ "$VERSION_ID" = "22.04" ]; then
                  echo "SYSTEM_VERSION=older" >> $GITHUB_ENV
              elif [ "$VERSION_ID" = "24.04" ]; then
                  echo "SYSTEM_VERSION=newer" >> $GITHUB_ENV
              else
                  echo "❌ Not Supported: $VERSION_ID"
                  false
              fi
          elif [ "$ID" = "arch" ]; then
              echo "SYSTEM_VERSION=arch" >> $GITHUB_ENV
          else
              echo "❌ Not Supported: $PRETTY_NAME"
              false
          fi

      - name: Remove useless tools
        if: env.SYSTEM_VERSION == 'newer' || env.SYSTEM_VERSION == 'older'
        shell: bash
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Move Patch and Tools
        shell: bash
        run: |
          # Move patch folder to tmp
          mv $GITHUB_WORKSPACE/Patches /tmp/

          # Set curlx
          mv $GITHUB_WORKSPACE/Bin /tmp/
          chmod 777 /tmp/Bin/curlx.sh
          echo "CURLX=/tmp/Bin/curlx.sh" >> $GITHUB_ENV

          # Copy Shell
          cp /tmp/Bin/found_gcc.sh ./

      - name: Install necessary packages
        shell: bash
        run: |
          if [ "${{ env.SYSTEM_VERSION }}" == "oldest" ]; then
            # Tzdata
            TZ=America/Los_Angeles
            ln -snf "/usr/share/zoneinfo/$TZ" /etc/localtime
            echo "$TZ" > /etc/timezone

            apt-get update
            apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler wget curl cpio -y
            apt-get install p7zip p7zip-full -y
            apt-get install libtinfo5 -y

            # Install Coccinelle
            if [[ "${{ env.HIDE_STUFF }}" == "true" ]]; then
                apt-get install pkg-config ocaml-nox ocaml-findlib autoconf libpcre3-dev python3-dev menhir libparmap-ocaml-dev libpcre-ocaml-dev -y
                wget https://coccinelle.gitlabpages.inria.fr/website/distrib/coccinelle-1.3.tar.gz
                tar zxf coccinelle-1.3.tar.gz
                cd coccinelle-1.3
                ./autogen
                ./configure
                make
                make install
            fi

            if [ "${{ env.PYTHON_VERSION }}" == "3" ]; then
                apt install python3 -y
                rm -rf /usr/bin/python
                ln -s /usr/bin/python3 /usr/bin/python
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 3 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            elif [ "${{ env.PYTHON_VERSION }}" == "2" ]; then
                apt install python2 -y
                rm -rf /usr/bin/python
                ln -s /usr/bin/python2.7 /usr/bin/python
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 2 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            else
                echo ">>>>>>>>>>>>>>>>>Error<<<<<<<<<<<<<<<<<"
                echo ">                                     <"
                echo ">You need choose a vaild python version"
                echo ">                                     <"
                echo ">>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<"
                false
            fi

            echo "Python Version"
            echo ">$(python -V)"
            echo ">>EOF"

          elif [ "${{ env.SYSTEM_VERSION }}" == "older" ]; then

            sudo apt-get update
            sudo apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler wget curl cpio -y
            sudo apt-get install p7zip p7zip-full -y
            sudo apt-get install libtinfo5 -y

            # Install Coccinelle
            if [[ "${{ env.HIDE_STUFF }}" == "true" ]]; then
                apt-get install pkg-config ocaml-nox ocaml-findlib autoconf libpcre3-dev python3-dev menhir libparmap-ocaml-dev libpcre-ocaml-dev -y
                wget https://coccinelle.gitlabpages.inria.fr/website/distrib/coccinelle-1.3.tar.gz
                tar zxf coccinelle-1.3.tar.gz
                cd coccinelle-1.3
                ./autogen
                ./configure
                make
                make install
            fi

            if [ "${{ env.PYTHON_VERSION }}" == "3" ]; then
                sudo apt install python3 -y
                sudo rm -rf /usr/bin/python
                sudo ln -s /usr/bin/python3 /usr/bin/python
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 3 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            elif [ "${{ env.PYTHON_VERSION }}" == "2" ]; then
                sudo apt install python2 -y
                sudo rm -rf /usr/bin/python
                sudo ln -s /usr/bin/python2.7 /usr/bin/python
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 2 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            else
                echo ">>>>>>>>>>>>>>>>>Error<<<<<<<<<<<<<<<<<"
                echo ">                                     <"
                echo ">You need choose a vaild python version"
                echo ">                                     <"
                echo ">>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<"
                false
            fi

            echo "Python Version"
            echo ">"
            echo "$(python -V)"
            echo ">"
            echo ">EOF"

          elif [ "${{ env.SYSTEM_VERSION }}" == "newer" ]; then

            sudo apt update
            sudo apt install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio coccinelle -y
            sudo apt-get install zstd libc6 binutils libc6-dev-i386 gcc g++ p7zip p7zip-full -y

            # Install Libtinfo5
            ${{ env.CURLX }} http://launchpadlibrarian.net/580830584/libtinfo5_6.3-2_amd64.deb libtinfo5.deb
            sudo apt install ./libtinfo5.deb
            rm -f libtinfo5.deb

            if [ "${{ env.PYTHON_VERSION }}" == "3" ]; then
                sudo apt install python3 -y
                sudo rm -rf /usr/bin/python
                sudo ln -s /usr/bin/python3 /usr/bin/python
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 3 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            elif [ "${{ env.PYTHON_VERSION }}" == "2" ]; then
                wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
                tar -xvf Python-2.7.18.tgz
                cd Python-2.7.18
                ./configure
                make -j$(nproc)
                sudo make install
                curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
                sudo python2.7 get-pip.py
                sudo update-alternatives --install /usr/bin/python python /usr/local/lib/python2.7 1
                cd ../
                rm -rf Python-2.7.18 Python-2.7.18.tgz
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 2 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            else
                echo ">>>>>>>>>>>>>>>>>Error<<<<<<<<<<<<<<<<<"
                echo ">                                     <"
                echo ">You need choose a vaild python version"
                echo ">                                     <"
                echo ">>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<"
                false
            fi

            echo "Python Version"
            echo ">"
            echo "$(python -V)"
            echo ">"
            echo ">EOF"

          elif [ "${{ env.SYSTEM_VERSION }}" == "arch" ]; then

            pacman-key --init
            pacman -Syyu --noconfirm
            pacman -S git base-devel systemd wget rustup curl patch ccache automake flex lzop bison gperf zip curl bzip2 squashfs-tools pngcrush schedtool make optipng maven pwgen minicom bc unzip 7zip zstd binutils gcc wget which libxml2-legacy cpio --noconfirm

            # Install Coccinelle
            if [[ "${{ env.HIDE_STUFF }}" == "true" ]]; then
                echo -e "\n[archlinuxcn]\nServer = https://repo.archlinuxcn.org/\$arch" >> /etc/pacman.conf
                pacman -Syy
                pacman -S archlinuxcn-keyring --noconfirm
                pacman -S coccinelle --noconfirm
            fi

            if [ "${{ env.PYTHON_VERSION }}" == "3" ]; then
                pacman -S python3 --noconfirm
                rm -rf /usr/bin/python
                ln -s /usr/bin/python3 /usr/bin/python
                echo ">>>>>>><<<<<<<"
                echo ">            <"
                echo "> Python - 3 <"
                echo ">            <"
                echo ">>>>>>><<<<<<<"
            elif [ "${{ env.PYTHON_VERSION }}" == "2" ]; then
                echo ">>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<"
                echo ">                              <"
                echo "> Could not supported Python 2 <"
                echo ">                              <"
                echo ">>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<"
                false
            else
                echo ">>>>>>>>>>>>>>>>>Error<<<<<<<<<<<<<<<<<"
                echo ">                                     <"
                echo ">You need choose a vaild python version"
                echo ">                                     <"
                echo ">>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<"
                false
            fi

            echo "Python Version"
            echo ">"
            echo "$(python -V)"
            echo ">"
            echo ">EOF"

            # Update Rust Toolchain
            rustup default stable

          else
            echo "❌ Your system os cannot supported."
          fi

      - name: Install Custom Toolchain (Pixel 4)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          
          # Clone custom toolchain
          git clone --depth=1 https://github.com/pkm774/android-kernel-tools tools
          
          # Set toolchain paths
          CLANG_PATH="$GITHUB_WORKSPACE/tools/clang/host/linux-x86/clang-r428724"
          GCC_64_PATH="$GITHUB_WORKSPACE/tools/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC_32_PATH="$GITHUB_WORKSPACE/tools/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
          
          # Export to environment
          echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
          echo "GCC_64_PATH=$GCC_64_PATH" >> $GITHUB_ENV
          echo "GCC_32_PATH=$GCC_32_PATH" >> $GITHUB_ENV
          
          # Export PATH
          echo "PATH=${CLANG_PATH}/bin:${GCC_64_PATH}/bin:${GCC_32_PATH}/bin:${PATH}" >> $GITHUB_ENV
          
          # Export build variables
          echo "BUILD_CC=${CLANG_PATH}/bin/clang" >> $GITHUB_ENV
          echo "BUILD_CROSS_COMPILE=${GCC_64_PATH}/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=${GCC_32_PATH}/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          
          # Export LLVM tools
          echo "AR=${CLANG_PATH}/bin/llvm-ar" >> $GITHUB_ENV
          echo "NM=${CLANG_PATH}/bin/llvm-nm" >> $GITHUB_ENV
          echo "LD=${CLANG_PATH}/bin/ld.lld" >> $GITHUB_ENV
          echo "STRIP=${CLANG_PATH}/bin/llvm-strip" >> $GITHUB_ENV
          echo "OBJCOPY=${CLANG_PATH}/bin/llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=${CLANG_PATH}/bin/llvm-objdump" >> $GITHUB_ENV
          echo "READELF=${CLANG_PATH}/bin/llvm-readelf" >> $GITHUB_ENV
          echo "HOSTCC=${CLANG_PATH}/bin/clang" >> $GITHUB_ENV
          echo "HOSTCXX=${CLANG_PATH}/bin/clang++" >> $GITHUB_ENV
          
          # Host flags
          echo "HOSTCFLAGS=-Wno-deprecated-declarations" >> $GITHUB_ENV
          echo "HOSTCXXFLAGS=-Wno-deprecated-declarations" >> $GITHUB_ENV
          
          # CLANG_TRIPLE
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          
          echo ">>>>>>>>>>Toolchain Status<<<<<<<<<<"
          echo ">                                  <"
          echo ">   Custom Pixel 4 Toolchain Set   <"
          echo ">     Clang: r428724               <"
          echo ">     GCC: 4.9                     <"
          echo ">                                  <"
          echo ">>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<<"

      - name: Get DTC Tool
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          
          # Clone DTC repo
          git clone --depth=1 https://github.com/Hassan5677/PIXEL-DTC.git dtc-repo
          
          # Set DTC_EXT path
          if [ -f "$GITHUB_WORKSPACE/dtc-repo/dtc" ]; then
            chmod +x $GITHUB_WORKSPACE/dtc-repo/dtc
            echo "DTC_EXT=$GITHUB_WORKSPACE/dtc-repo/dtc" >> $GITHUB_ENV
            echo ">>>>>>>>>>DTC Status<<<<<<<<<<"
            echo ">                            <"
            echo ">   Custom DTC Tool Set      <"
            echo ">                            <"
            echo ">>>>>>>>>>>>>>><<<<<<<<<<<<<<<"
          else
            echo "DTC not found, will use system dtc"
            echo "DTC_EXT=" >> $GITHUB_ENV
          fi
          
          # Set prebuilt DTB path for later use
          if [ -f "$GITHUB_WORKSPACE/dtc-repo/*.dtb" ] || [ -f "$GITHUB_WORKSPACE/dtc-repo/"*.dtb ]; then
            echo "HAS_PREBUILT_DTB=true" >> $GITHUB_ENV
            echo "PREBUILT_DTB_PATH=$GITHUB_WORKSPACE/dtc-repo" >> $GITHUB_ENV
          fi

      - name: Set Compile Environment
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE

          # Skip GCC setup as we use custom toolchain
          echo ">>>>>>>>>>GCC Status<<<<<<<<<<"
          echo ">                            <"
          echo ">   Using Custom Toolchain   <"
          echo ">   (Skip standard GCC)      <"
          echo ">                            <"
          echo ">>>>>>>>>>>>>>><<<<<<<<<<<<<<<"

          # Skip Clang setup as we use custom toolchain
          echo ">>>>>>>>>>Clang Status<<<<<<<<<<"
          echo ">                              <"
          echo ">   Using Custom Clang r428724 <"
          echo ">   (Skip standard Clang)      <"
          echo ">                              <"
          echo ">>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<"
