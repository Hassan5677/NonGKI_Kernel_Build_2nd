name: 'Execute the compilation process.'

runs:
  using: 'composite'
  steps:
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}${{ env.UPLOADNAME }}
          max-size: 2G

      - name: Apply ThinLTO Config
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          apply_lto_config() {
              local config_file="${GITHUB_WORKSPACE}/device_kernel/out/.config"
              
              echo -e "\n[INFO]: Applying ThinLTO configuration..."
              
              if [ ! -f "$config_file" ]; then
                  echo -e "[ERROR]: .config not found at ${config_file}"
                  exit 1
              fi
              
              # Disable Full LTO options
              ./scripts/config --file "$config_file" --disable CONFIG_LTO
              ./scripts/config --file "$config_file" --disable CONFIG_LTO_CLANG_FULL
              ./scripts/config --file "$config_file" --disable CONFIG_LTO_NONE
              
              # Enable ThinLTO
              ./scripts/config --file "$config_file" --enable CONFIG_LTO_CLANG
              ./scripts/config --file "$config_file" --enable CONFIG_LTO_CLANG_THIN
              ./scripts/config --file "$config_file" --enable CONFIG_THINLTO
              
              echo -e "[INFO]: ThinLTO configuration applied"
          }
          
          # Save function for later use
          echo "apply_lto_config() {
              local config_file=\"${GITHUB_WORKSPACE}/device_kernel/out/.config\"
              ./scripts/config --file \"\$config_file\" --disable CONFIG_LTO
              ./scripts/config --file \"\$config_file\" --disable CONFIG_LTO_CLANG_FULL
              ./scripts/config --file \"\$config_file\" --disable CONFIG_LTO_NONE
              ./scripts/config --file \"\$config_file\" --enable CONFIG_LTO_CLANG
              ./scripts/config --file \"\$config_file\" --enable CONFIG_LTO_CLANG_THIN
              ./scripts/config --file \"\$config_file\" --enable CONFIG_THINLTO
          }" >> /tmp/apply_lto.sh

      - name: Build Kernel
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Export all custom toolchain variables
          export PATH="${{ env.CLANG_PATH }}/bin:${{ env.GCC_64_PATH }}/bin:${{ env.GCC_32_PATH }}/bin:${PATH}"
          export BUILD_CC="${{ env.BUILD_CC }}"
          export BUILD_CROSS_COMPILE="${{ env.BUILD_CROSS_COMPILE }}"
          export CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}"
          export CLANG_TRIPLE="${{ env.CLANG_TRIPLE }}"
          export DTC_EXT="${{ env.DTC_EXT }}"
          export AR="${{ env.AR }}"
          export NM="${{ env.NM }}"
          export LD="${{ env.LD }}"
          export STRIP="${{ env.STRIP }}"
          export OBJCOPY="${{ env.OBJCOPY }}"
          export OBJDUMP="${{ env.OBJDUMP }}"
          export READELF="${{ env.READELF }}"
          export HOSTCC="${{ env.HOSTCC }}"
          export HOSTCXX="${{ env.HOSTCXX }}"
          export HOSTCFLAGS="${{ env.HOSTCFLAGS }}"
          export HOSTCXXFLAGS="${{ env.HOSTCXXFLAGS }}"

          echo "================"
          echo "=Read Defconfig="
          echo "================"
          
          make -C "${GITHUB_WORKSPACE}/device_kernel" \
              O="${GITHUB_WORKSPACE}/device_kernel/out" \
              -j"$(nproc)" \
              ARCH=arm64 \
              CROSS_COMPILE="${BUILD_CROSS_COMPILE}" \
              CC="${BUILD_CC}" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
              DTC_EXT="${DTC_EXT}" \
              AR="${AR}" \
              NM="${NM}" \
              LD="${LD}" \
              STRIP="${STRIP}" \
              OBJCOPY="${OBJCOPY}" \
              OBJDUMP="${OBJDUMP}" \
              READELF="${READELF}" \
              HOSTCC="${HOSTCC}" \
              HOSTCXX="${HOSTCXX}" \
              HOSTCFLAGS="${HOSTCFLAGS}" \
              HOSTCXXFLAGS="${HOSTCXXFLAGS}" \
              floral_defconfig

          # Apply ThinLTO config
          bash /tmp/apply_lto.sh

          echo "======================="
          echo "=Execute olddefconfig="
          echo "======================="
          
          make -C "${GITHUB_WORKSPACE}/device_kernel" \
              O="${GITHUB_WORKSPACE}/device_kernel/out" \
              -j"$(nproc)" \
              ARCH=arm64 \
              CROSS_COMPILE="${BUILD_CROSS_COMPILE}" \
              CC="${BUILD_CC}" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
              DTC_EXT="${DTC_EXT}" \
              AR="${AR}" \
              NM="${NM}" \
              LD="${LD}" \
              STRIP="${STRIP}" \
              OBJCOPY="${OBJCOPY}" \
              OBJDUMP="${OBJDUMP}" \
              READELF="${READELF}" \
              HOSTCC="${HOSTCC}" \
              HOSTCXX="${HOSTCXX}" \
              HOSTCFLAGS="${HOSTCFLAGS}" \
              HOSTCXXFLAGS="${HOSTCXXFLAGS}" \
              olddefconfig

          # KPM Detect
          if [[ "${{ env.KPM_ENABLE }}" == "true" ]] && [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
            if grep -q "CONFIG_KALLSYMS_ALL=y" "out/.config"; then
                sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' out/.config
                echo "[+] Enabled KPM."
            else
                echo "[-] Your didn't enabled KALLSYMS_ALL."
            fi

            if grep -q "CONFIG_KPM=y" "out/.config"; then
                echo "[+] Detected KPM."
            else
                echo "[-] Could not detect KPM."
            fi
          fi

          echo "======================"
          echo "=Execute Clang Build="
          echo "======================"

          if [[ "${{ env.BASEBAND_GUARD_ENABLE }}" == "true" ]]; then
              make -j$(nproc --all) \
                  -C "${GITHUB_WORKSPACE}/device_kernel" \
                  O="${GITHUB_WORKSPACE}/device_kernel/out" \
                  ARCH=arm64 \
                  CROSS_COMPILE="${BUILD_CROSS_COMPILE}" \
                  CC="${BUILD_CC}" \
                  CLANG_TRIPLE=aarch64-linux-gnu- \
                  CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
                  DTC_EXT="${DTC_EXT}" \
                  AR="${AR}" \
                  NM="${NM}" \
                  LD="${LD}" \
                  STRIP="${STRIP}" \
                  OBJCOPY="${OBJCOPY}" \
                  OBJDUMP="${OBJDUMP}" \
                  READELF="${READELF}" \
                  HOSTCC="${HOSTCC}" \
                  HOSTCXX="${HOSTCXX}" \
                  HOSTCFLAGS="${HOSTCFLAGS}" \
                  HOSTCXXFLAGS="${HOSTCXXFLAGS}" \
                  security/selinux/
              echo "[+] Pre-built SELinux done."
          fi

          make -j$(nproc --all) \
              -C "${GITHUB_WORKSPACE}/device_kernel" \
              O="${GITHUB_WORKSPACE}/device_kernel/out" \
              ARCH=arm64 \
              CROSS_COMPILE="${BUILD_CROSS_COMPILE}" \
              CC="${BUILD_CC}" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
              DTC_EXT="${DTC_EXT}" \
              AR="${AR}" \
              NM="${NM}" \
              LD="${LD}" \
              STRIP="${STRIP}" \
              OBJCOPY="${OBJCOPY}" \
              OBJDUMP="${OBJDUMP}" \
              READELF="${READELF}" \
              HOSTCC="${HOSTCC}" \
              HOSTCXX="${HOSTCXX}" \
              HOSTCFLAGS="${HOSTCFLAGS}" \
              HOSTCXXFLAGS="${HOSTCXXFLAGS}" \
              2>&1 | tee error.log

      - name: Copy Prebuilt DTB
        if: env.HAS_PREBUILT_DTB == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          mkdir -p "$IMAGE_DIR"
          
          # Copy prebuilt DTB from DTC repo
          if [ -f "${{ env.PREBUILT_DTB_PATH }}"/*.dtb ]; then
            cp ${{ env.PREBUILT_DTB_PATH }}/*.dtb "$IMAGE_DIR/dtb"
            echo "[+] Copied prebuilt DTB"
          fi

      - name: Analyze compile error
        if: ${{ failure() && env.BUILD_DEBUGGER == 'true' }}
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          cp /tmp/Bin/check_error.sh ./
          cp /tmp/Bin/pack_error_files.sh ./

          bash check_error.sh
          bash pack_error_files.sh

      - name: KPM Patcher (Experiment)
        if: env.KPM_ENABLE == 'true' && env.KPM_INLINE == 'true' || env.KPM_KPATCH_NEXT == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
              MODE="gz-dtb"
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
              MODE="gz"
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
              MODE="plain"
          else
              echo "No valid Image file found."
              exit 1
          fi

          case "$MODE" in
            gz-dtb)
              if [ -f "include/linux/set_memory.h" ]; then
                  if [[ -d "arch/arm64/configs" ]]; then
                    IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
                  else
                    IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm/boot"
                  fi

                  if ls $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                      DTB_PATH="dts"
                  elif ls $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                      DTB_PATH="dts/vendor"
                  else
                      echo "Not found dts, abort."
                      false
                  fi

                  rm -f "$IMAGE_DIR/Image.gz-dtb" "$IMAGE_DIR/Image.gz"

                  if [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
                    cp patch "$IMAGE_DIR/"
                  else
                    cp kpimg-linux "$IMAGE_DIR/"
                    cp kptools-linux "$IMAGE_DIR/"
                  fi

                  cd "$IMAGE_DIR/" || exit 1

                  if [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
                    ./patch
                  else
                    ./kptools-linux -p -k kptools-linux -i Image -o oImage
                  fi

                  rm -f Image
                  mv oImage Image
                  gzip -c Image > Image.gz
                  cat Image.gz $DTB_PATH/${{ env.GENERATE_CHIP }}/*.dtb > Image.gz-dtb
                  echo "Hook Image successfully !"
              else
                  echo "Not supported for your kernel !"
              fi
              ;;
            gz)
              rm -f "$IMAGE_DIR/Image.gz"

              if [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
                cp patch "$IMAGE_DIR/"
              else
                cp kpimg-linux "$IMAGE_DIR/"
                cp kptools-linux "$IMAGE_DIR/"
              fi

              cd "$IMAGE_DIR/" || exit 1

              if [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
                ./patch
              else
                ./kptools-linux -p -k kptools-linux -i Image -o oImage
              fi

              rm -f Image
              mv oImage Image
              gzip -c Image > Image.gz
              echo "Hook Image successfully !"
              ;;
            plain)

              if [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
                cp patch "$IMAGE_DIR/"
              else
                cp kpimg-linux "$IMAGE_DIR/"
                cp kptools-linux "$IMAGE_DIR/"
              fi

              cd "$IMAGE_DIR/" || exit 1

              if [[ "${{ env.KPM_INLINE }}" == "true" ]]; then
                ./patch
              else
                ./kptools-linux -p -k kptools-linux -i Image -o oImage
              fi

              mv oImage Image
              echo "Hook Image successfully !"
              ;;
          esac

      - name: Upload Build Error Files
        if: ${{ failure() && env.BUILD_DEBUGGER == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: compile_error_files
          path: |
            device_kernel/error.log
            device_kernel/error_files.zip
